oracles:
  - name: cuda-for-apple-public-integration
    target: cuda-for-apple-public-integration
    aliases:
      - cuda-for-apple
      - tensorcore-public-integration
      - continue Tensorcore production readiness build-out
    criteria:
      - id: release_smoke_runtime_evidence
        runtime_check: runtime_evidence_present
        severity: high
        label: Release smoke runtime evidence is present
        action: run_release_smoke

      - id: release_smoke_failure_free
        runtime_check: failure_free
        severity: high
        label: Release smoke is failure-free
        action: fix_runtime_failure

      - id: public_core_paths_covered
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.public_core_paths.runtime_status]
          event_values: [passed, skipped_no_gpu]
        severity: high
        label: Public core runtime path coverage is explicit
        action: extend_release_smoke_coverage

      - id: packaging_and_consumers_passed
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.packaging_and_consumers.runtime_status]
          event_values: [passed]
        severity: high
        label: Wheel, editable install, CMake, and pkg-config consumers passed
        action: fix_public_integration_smoke

      - id: no_synthetic_public_prod_paths
        no_stubbed_paths:
          - synthetic_model_only
        path_prefixes:
          - include
          - lib
          - python/tensorcore
        severity: high
        label: Public production paths are not synthetic-only
        action: wire_real_path_or_mark_fallback

      - id: metal4_tensorops_compile_status_recorded
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.metal4_tensorops.runtime_compile_status]
          event_values: [compiled, skipped_sdk_too_old]
        severity: high
        label: Metal 4 TensorOps compile status is explicit
        action: emit_tensorops_compile_status

      - id: metal4_tensorops_compiled_with_sdk26
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.metal4_tensorops.runtime_compile_status]
          event_values: [compiled]
        severity: high
        label: Metal 4 TensorOps compiled with SDK 26 or newer
        action: run_release_smoke_on_sdk26

      - id: metal4_tensorops_runtime_covered
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.metal4_tensorops.runtime_status]
          event_values: [passed]
        severity: high
        label: Metal 4 TensorOps runtime path is covered on M5
        action: run_m5_tensorops_runtime_smoke

  - name: pytorch-bridge-runtime-evidence
    target: pytorch-bridge-runtime-evidence
    aliases:
      - pytorch-bridge
      - tensorcore-pytorch-bridge
    criteria:
      - id: pytorch_bridge_runtime_evidence
        runtime_check: runtime_evidence_present
        severity: high
        label: PyTorch bridge runtime evidence is present
        action: run_check_pytorch_bridge_runtime

      - id: pytorch_bridge_failure_free
        runtime_check: failure_free
        severity: high
        label: PyTorch bridge runtime is failure-free
        action: fix_pytorch_bridge_runtime_failure

      - id: pytorch_bridge_cuda_runtime_passed
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.pytorch_bridge_cuda.runtime_status]
          event_values: [passed, skipped_no_gpu]
        severity: high
        label: PyTorch bridge CUDA runtime is covered (or explicitly skipped)
        action: run_pytorch_bridge_smoke

      - id: pytorch_bridge_matmul_engaged
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.pytorch_bridge_cuda.probes.matmul_2d.last_backend]
          # Accept any GEMM backend tensorcore actually dispatches to:
          #   cuda            — NVIDIA path (cosbox/GCP)
          #   hip             — AMD path
          #   accelerate_cpu  — Apple Accelerate framework (Mac fp32 BLAS)
          #   cpu_blas        — Generic BLAS link (Linux OpenBLAS, etc.)
          #   cpu_cblas       — Generic CBLAS link
          #   portable_cpu    — Always-available fallback C++ loop (correct,
          #                     just unaccelerated)
          # The set covers every host where tensorcore is expected to run,
          # while excluding "none" (which means the bridge didn't engage at all).
          event_values: [cuda, hip, accelerate_cpu, cpu_blas, cpu_cblas, portable_cpu]
        severity: high
        label: aten::matmul routes through tc_gemm
        action: rebuild_bridge_against_tc_enable_cuda

      - id: pytorch_bridge_matmul_3d_engaged
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.pytorch_bridge_cuda.probes.matmul_3d_x_2d_with_grad.last_backend]
          # Accept any GEMM backend tensorcore actually dispatches to:
          #   cuda            — NVIDIA path (cosbox/GCP)
          #   hip             — AMD path
          #   accelerate_cpu  — Apple Accelerate framework (Mac fp32 BLAS)
          #   cpu_blas        — Generic BLAS link (Linux OpenBLAS, etc.)
          #   cpu_cblas       — Generic CBLAS link
          #   portable_cpu    — Always-available fallback C++ loop (correct,
          #                     just unaccelerated)
          # The set covers every host where tensorcore is expected to run,
          # while excluding "none" (which means the bridge didn't engage at all).
          event_values: [cuda, hip, accelerate_cpu, cpu_blas, cpu_cblas, portable_cpu]
        severity: high
        label: 3-D x 2-D matmul (nn.Linear shape) routes through bridge with autograd
        action: fix_tc_matmul_autograd_extended

      - id: pytorch_bridge_bmm_engaged
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.pytorch_bridge_cuda.probes.bmm_3d_with_grad.last_backend]
          # Accept any GEMM backend tensorcore actually dispatches to:
          #   cuda            — NVIDIA path (cosbox/GCP)
          #   hip             — AMD path
          #   accelerate_cpu  — Apple Accelerate framework (Mac fp32 BLAS)
          #   cpu_blas        — Generic BLAS link (Linux OpenBLAS, etc.)
          #   cpu_cblas       — Generic CBLAS link
          #   portable_cpu    — Always-available fallback C++ loop (correct,
          #                     just unaccelerated)
          # The set covers every host where tensorcore is expected to run,
          # while excluding "none" (which means the bridge didn't engage at all).
          event_values: [cuda, hip, accelerate_cpu, cpu_blas, cpu_cblas, portable_cpu]
        severity: high
        label: aten::bmm routes through tc_gemm (attention QK^T / attn @ V)
        action: fix_tc_bmm_dispatch

      - id: pytorch_bridge_einsum_engaged
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.pytorch_bridge_cuda.probes.einsum_attention_qkt.last_backend]
          # Accept any GEMM backend tensorcore actually dispatches to:
          #   cuda            — NVIDIA path (cosbox/GCP)
          #   hip             — AMD path
          #   accelerate_cpu  — Apple Accelerate framework (Mac fp32 BLAS)
          #   cpu_blas        — Generic BLAS link (Linux OpenBLAS, etc.)
          #   cpu_cblas       — Generic CBLAS link
          #   portable_cpu    — Always-available fallback C++ loop (correct,
          #                     just unaccelerated)
          # The set covers every host where tensorcore is expected to run,
          # while excluding "none" (which means the bridge didn't engage at all).
          event_values: [cuda, hip, accelerate_cpu, cpu_blas, cpu_cblas, portable_cpu]
        severity: high
        label: torch.einsum 'bhid,bhjd->bhij' attention pattern routes through bridge
        action: verify_einsum_to_bmm_decomposition

  - name: eshkol-bridge-runtime-evidence
    target: eshkol-bridge-runtime-evidence
    aliases:
      - exercise Eshkol bridge runtime evidence
    criteria:
      - id: eshkol_bridge_runtime_evidence
        runtime_check: runtime_evidence_present
        severity: high
        label: Eshkol bridge runtime evidence is present
        action: run_eshkol_bridge_smoke

      - id: eshkol_bridge_failure_free
        runtime_check: failure_free
        severity: high
        label: Eshkol bridge runtime evidence is failure-free
        action: fix_eshkol_bridge_runtime_failure

      - id: hello_tensorcore_runtime_passed
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.hello_tensorcore_runtime.status]
          event_values: [passed]
        severity: high
        label: hello_tensorcore.esk runs through tensorcore
        action: fix_hello_tensorcore_runtime

      - id: tensorcore_bridge_smoke_runtime_passed
        runtime_event:
          event_kinds: [runtime_backend]
          event_names: [checks.tensorcore_bridge_smoke_runtime.status]
          event_values: [passed]
        severity: high
        label: tensorcore_bridge_smoke.esk runs the broader bridge surface
        action: fix_tensorcore_bridge_runtime
