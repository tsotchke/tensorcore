name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Version consistency
        run: scripts/check_version_consistency.sh

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Prepare release Python
        run: |
          python3 -m venv "$RUNNER_TEMP/tensorcore-release-venv"
          "$RUNNER_TEMP/tensorcore-release-venv/bin/python" -m pip install --upgrade pip setuptools wheel

      - name: Release smoke
        env:
          PYTHON_BIN: ${{ runner.temp }}/tensorcore-release-venv/bin/python
          PREFIX: ${{ runner.temp }}/tensorcore-native-sdk
          WHEEL_DIR: dist
          TENSORCORE_RELEASE_SMOKE_EVIDENCE_PATH: build/release_smoke_runtime_evidence.json
        run: scripts/release_smoke.sh

      - name: Check runtime evidence
        run: python3 scripts/check_release_evidence.py build/release_smoke_runtime_evidence.json

      - name: Create and verify macOS native SDK
        env:
          PYTHON_BIN: ${{ runner.temp }}/tensorcore-release-venv/bin/python
          OUT_DIR: dist
        run: |
          archive="$(scripts/create_native_sdk_archive.sh "$RUNNER_TEMP/tensorcore-native-sdk")"
          scripts/check_native_sdk_archive.sh "$archive"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tensorcore-smoke-evidence
          path: build/release_smoke_runtime_evidence.json
          if-no-files-found: error

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tensorcore-release-macos
          path: |
            dist/tensorcore_apple-*.whl
            dist/tensorcore-native-sdk-*-macos-*.tar.gz
          if-no-files-found: error

  linux-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Version consistency
        run: scripts/check_version_consistency.sh

      - name: Portable CPU build, tests, and consumers
        env:
          TC_CPU_BUILD_DIR: ${{ runner.temp }}/tensorcore-build
          TC_CPU_INSTALL_DIR: ${{ runner.temp }}/tensorcore-install
          TC_CPU_CONSUMER_DIR: ${{ runner.temp }}/tensorcore-consumer
        run: scripts/ci_portable_cpu.sh

      - name: Create and verify Linux native SDK
        env:
          OUT_DIR: dist
        run: |
          mkdir -p dist
          archive="$(scripts/create_native_sdk_archive.sh "$RUNNER_TEMP/tensorcore-install")"
          scripts/check_native_sdk_archive.sh "$archive"

      - name: Upload Linux native SDK
        uses: actions/upload-artifact@v7
        with:
          name: tensorcore-release-linux
          path: dist/tensorcore-native-sdk-*-linux-*.tar.gz
          if-no-files-found: error

  windows-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Version consistency
        shell: bash
        run: scripts/check_version_consistency.sh

      - name: Portable CPU build, tests, and consumers
        shell: pwsh
        run: >
          ./scripts/ci_windows_cpu.ps1
          -BuildDir "$env:RUNNER_TEMP/tensorcore-build"
          -Prefix "$env:RUNNER_TEMP/tensorcore-install"

      - name: Create and verify Windows native SDK
        shell: pwsh
        run: |
          $Archive = ./scripts/create_native_sdk_archive.ps1 `
            -Prefix "$env:RUNNER_TEMP/tensorcore-install" `
            -OutDir "$env:GITHUB_WORKSPACE/dist"
          ./scripts/check_native_sdk_archive.ps1 -Archive $Archive

      - name: Upload Windows native SDK
        uses: actions/upload-artifact@v7
        with:
          name: tensorcore-release-windows
          path: dist/tensorcore-native-sdk-*-windows-*.zip
          if-no-files-found: error

  publish:
    needs: [macos-release, linux-sdk, windows-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tensorcore-release-*
          path: dist
          merge-multiple: true

      - name: Create and verify release checksums
        run: scripts/create_release_checksums.sh dist

      - name: Upload release checksums
        uses: actions/upload-artifact@v7
        with:
          name: tensorcore-release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated tensorcore release for $GITHUB_REF_NAME."
          gh release upload "$GITHUB_REF_NAME" \
            dist/tensorcore_apple-*.whl \
            dist/tensorcore-native-sdk-*.tar.gz \
            dist/tensorcore-native-sdk-*.zip \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
